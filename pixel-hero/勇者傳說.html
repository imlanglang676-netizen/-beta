    function drawPauseMenu() {
      const p = game.player;
      ctx.fillStyle = 'rgba(2, 6, 23, 0.92)';
      ctx.fillRect(16, 40, SCREEN_W - 32, SCREEN_H - 64);
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3;
      ctx.strokeRect(16, 40, SCREEN_W - 32, SCREEN_H - 64);

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('連恩的背包與狀態 (按 R 關閉)', SCREEN_W / 2, 74);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px monospace';
      ctx.fillText('點擊或按 1-5 切換裝備 ｜ Z 切弓 ｜ X 切箭 ｜ M 靜音', SCREEN_W / 2, 96);

      // 繪製 5 個道具格
      for (const r of MENU_ITEM_RECTS) {
        const selected = p.equippedItem === r.key;
        const unlocked =
          r.key === 'bomb' || r.key === 'potion' ||
          (r.key === 'boomerang' && p.hasBoomerang) ||
          (r.key === 'flame' && p.hasFlame) ||
          (r.key === 'bow' && p.ownedBows.length > 0);

        ctx.fillStyle = selected ? '#1e3a8a' : '#0f172a';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = selected ? '#facc15' : '#475569';
        ctx.lineWidth = 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);

        ctx.fillStyle = unlocked ? '#f8fafc' : '#475569';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(r.label, r.x + r.w / 2, r.y + 16);

        if (unlocked) {
          let spr = SPRITES.bomb;
          let info = '';
          if (r.key === 'bomb') { spr = SPRITES.bomb; info = `剩餘 ${p.bombs}`; }
          else if (r.key === 'potion') { spr = SPRITES.potion; info = `剩餘 ${p.potions}`; }
          else if (r.key === 'boomerang') { spr = SPRITES.boomerang; info = '已取得'; }
          else if (r.key === 'flame') { spr = SPRITES.flameIcon; info = '冷卻3秒'; }
          else if (r.key === 'bow') { spr = SPRITES[BOWS[p.equippedBow].sprite]; info = BOWS[p.equippedBow].name; }
          ctx.drawImage(spr, r.x + r.w / 2 - 8, r.y + 22);
          ctx.fillStyle = '#facc15';
          ctx.font = '10px monospace';
          ctx.fillText(info, r.x + r.w / 2, r.y + 56);
        } else {
          ctx.fillStyle = '#475569';
          ctx.font = '11px monospace';
          ctx.fillText('未獲得', r.x + r.w / 2, r.y + 42);
        }
      }

      // 下半部左：角色與武器資訊
      ctx.textAlign = 'left';
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('【裝備與進度】', 42, 206);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '12px monospace';
      const swordName = p.swordLevel === 0 ? '無' : p.swordLevel >= 2 ? '聖光之劍 (攻3)' : '勇者之劍 (攻2)';
      ctx.fillText(`主武器：${swordName}`, 42, 228);
      ctx.fillText(`盧比：${p.rupees} ｜ 古代鑰匙：${p.keys}`, 42, 248);
      ctx.fillText(`火焰魔龍：${game.bossDefeated ? '已討伐' : '未討伐'}`, 42, 268);
      ctx.fillText(`終極災滅：${game.zaimieDefeated ? '已討伐' : '未討伐'}`, 42, 288);
      ctx.fillText(`音效狀態：${sound.muted ? '已靜音 (M)' : '開啟 (M)'}`, 42, 308);

      // 弓箭庫存 (僅在擁有弓或箭時顯示細節，零隱藏地點提示)
      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 12px monospace';
      const bowText = p.ownedBows.length > 0 ? p.ownedBows.map(id => BOWS[id].name).join('、') : '尚無';
      ctx.fillText(`持有弓：${bowText}`, 42, 336);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '11px monospace';
      ctx.fillText(
        `箭矢：普∞ 火${p.arrows.fire} 毒${p.arrows.poison} 爆${p.arrows.explosive} 光${p.arrows.light}`,
        42, 356
      );

      // 下半部右：4x4 探索大地圖
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('【4x4 世界地圖】', 310, 206);
      const mapX = 310;
      const mapY = 220;
      for (let ry = 0; ry < 4; ry++) {
        for (let rx = 0; rx < 4; rx++) {
          const k = `${rx},${ry}`;
          const vis = game.visited[k];
          ctx.fillStyle = vis ? '#334155' : '#0f172a';
          ctx.fillRect(mapX + rx * 40, mapY + ry * 32, 36, 28);
          ctx.strokeStyle = (!game.inSecretShop && game.rx === rx && game.ry === ry) ? '#facc15' : '#475569';
          ctx.lineWidth = 2;
          ctx.strokeRect(mapX + rx * 40, mapY + ry * 32, 36, 28);
          if (vis) {
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '9px monospace';
            ctx.textAlign = 'center';
            const shortName = game.rooms[k].name.slice(0, 2);
            ctx.fillText(shortName, mapX + rx * 40 + 18, mapY + ry * 32 + 17);
          }
        }
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px monospace';
      ctx.fillText(`目前位置：${getCurrentRoom().name}`, 388, 368);
    }

    function drawTitleScreen() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

      // 閃爍方塊星空
      for (let i = 0; i < 36; i++) {
        const sx = (i * 73 + 19) % SCREEN_W;
        const sy = (i * 47 + 29) % SCREEN_H;
        const blink = Math.floor(game.time * 3 + i) % 3 === 0;
        ctx.fillStyle = blink ? '#facc15' : '#334155';
        ctx.fillRect(sx, sy, 4, 4);
      }

      // 標題像素外框
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(46, 54, SCREEN_W - 92, 116);
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 4;
      ctx.strokeRect(46, 54, SCREEN_W - 92, 116);

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 38px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('像素勇者傳說', SCREEN_W / 2, 114);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 16px monospace';
      ctx.fillText('尋找聖物的冒險', SCREEN_W / 2, 148);

      // 置中放大顯示連恩像素角色
      ctx.drawImage(SPRITES.heroDown, 0, 0, 24, 24, SCREEN_W / 2 - 36, 198, 72, 72);

      // 操作說明
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('WASD / 方向鍵：移動    E：攻擊 / 互動', SCREEN_W / 2, 314);
      ctx.fillText('Q：使用道具    1-5：切換道具    Z/X：切弓與箭', SCREEN_W / 2, 340);
      ctx.fillText('R：背包與地圖    M：靜音開關', SCREEN_W / 2, 366);

      // 閃爍按 Enter 開始提示 (不含任何任務劇透文字)
      if (Math.floor(game.time * 2.5) % 2 === 0) {
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('▶ 按 ENTER 開始冒險 ◀', SCREEN_W / 2, 424);
      }
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 36px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('連恩倒下了...', SCREEN_W / 2, 180);

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '15px monospace';
      ctx.fillText(`探索區域：${Object.keys(game.visited).length} / 16`, SCREEN_W / 2, 235);
      ctx.fillText(`持有盧比：${game.player.rupees}`, SCREEN_W / 2, 265);

      if (Math.floor(game.time * 2.5) % 2 === 0) {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('按 ENTER 重新開始冒險', SCREEN_W / 2, 340);
      }
    }

    function drawVictory() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

      for (let i = 0; i < 40; i++) {
        const sx = (i * 89 + Math.floor(game.time * 20)) % SCREEN_W;
        const sy = (i * 53) % SCREEN_H;
        ctx.fillStyle = i % 2 === 0 ? '#facc15' : '#38bdf8';
        ctx.fillRect(sx, sy, 4, 4);
      }

      ctx.drawImage(SPRITES.relic, 0, 0, 24, 24, SCREEN_W / 2 - 36, 70, 72, 72);

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('恭喜通關！', SCREEN_W / 2, 190);

      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('勇者連恩擊敗了終極魔王【災滅】！', SCREEN_W / 2, 232);

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '14px monospace';
      const mins = Math.floor(game.playTime / 60);
      const secs = Math.floor(game.playTime % 60);
      ctx.fillText(`通關時間：${mins} 分 ${secs} 秒`, SCREEN_W / 2, 282);
      ctx.fillText(`探索地圖：${Object.keys(game.visited).length} / 16 區域`, SCREEN_W / 2, 310);
      ctx.fillText(`剩餘盧比：${game.player.rupees} ｜ 聖物碎片：${game.player.relicShards}`, SCREEN_W / 2, 338);

      if (Math.floor(game.time * 2.5) % 2 === 0) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('按 ENTER 再次遊玩', SCREEN_W / 2, 410);
      }
    }

    function render() {
      ctx.clearRect(0, 0, SCREEN_W, SCREEN_H);

      if (game.state === 'TITLE') {
        drawTitleScreen();
        return;
      }

      if (game.state === 'VICTORY') {
        drawVictory();
        return;
      }

      if (game.state === 'TRANSITION' && game.transition) {
        const tr = game.transition;
        const oldRoom = game.rooms[`${game.rx},${game.ry}`];
        const newRoom = game.rooms[`${tr.nextRx},${tr.nextRy}`];
        const t = Math.min(1, tr.progress);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, PLAY_Y, PLAY_W, PLAY_H);
        ctx.clip();

        const oldOx = -tr.dx * PLAY_W * t;
        const oldOy = PLAY_Y - tr.dy * PLAY_H * t;
        const newOx = tr.dx * PLAY_W * (1 - t);
        const newOy = PLAY_Y + tr.dy * PLAY_H * (1 - t);

        drawRoom(oldRoom, oldOx, oldOy, false);
        drawRoom(newRoom, newOx, newOy, false);
        ctx.restore();

        drawHUD();
        return;
      }

      // 一般遊玩 / 暫停 / 結束底圖
      drawRoom(getCurrentRoom(), 0, PLAY_Y, true);
      drawHUD();
      drawToast();

      if (game.state === 'PAUSED') {
        drawPauseMenu();
      } else if (game.state === 'GAMEOVER') {
        drawGameOver();
      }
    }

    // =========================================================================
    // 13. 輸入事件控制與主遊戲迴圈
    // =========================================================================
    function resetAndStartGame() {
      sound.init();
      game = createInitialGame();
      enterRoom(1, 1, false);
      game.state = 'PLAYING';
      sound.sfxSecret();
      showToast('連恩踏上了旅程！先向北方的神秘老人對話 (按 E) 吧。', 4.0);
    }

    function togglePauseMenu() {
      if (game.state === 'PLAYING') {
        game.state = 'PAUSED';
        sound.sfxMenuSelect();
      } else if (game.state === 'PAUSED') {
        game.state = 'PLAYING';
        sound.sfxMenuSelect();
      }
    }

    window.addEventListener('keydown', (e) => {
      const isEnter = e.code === 'Enter' || e.code === 'NumpadEnter' || e.key === 'Enter' || e.keyCode === 13;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) || isEnter) {
        e.preventDefault();
      }
      keys[e.code] = true;

      if (e.code === 'KeyM') {
        sound.init();
        sound.toggleMute();
        showToast(sound.muted ? '已靜音' : '已開啟音效', 1.4);
        return;
      }

      if (game.state === 'TITLE' || game.state === 'GAMEOVER' || game.state === 'VICTORY') {
        if (isEnter) {
          resetAndStartGame();
        }
        return;
      }

      if (e.code === 'KeyR') {
        togglePauseMenu();
        return;
      }

      if (game.state === 'PLAYING' || game.state === 'PAUSED') {
        if (e.code === 'Digit1' || e.code === 'Numpad1') { switchItemSlot(1); return; }
        if (e.code === 'Digit2' || e.code === 'Numpad2') { switchItemSlot(2); return; }
        if (e.code === 'Digit3' || e.code === 'Numpad3') { switchItemSlot(3); return; }
        if (e.code === 'Digit4' || e.code === 'Numpad4') { switchItemSlot(4); return; }
        if (e.code === 'Digit5' || e.code === 'Numpad5') { switchItemSlot(5); return; }
        if (e.code === 'KeyZ') { cycleBow(); return; }
        if (e.code === 'KeyX') { cycleArrow(); return; }
      }

      if (game.state !== 'PLAYING') return;

      sound.init();
      if (e.code === 'KeyE') {
        performAttackOrInteract();
      } else if (e.code === 'KeyQ') {
        useEquippedItem();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    window.addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
    });

    canvas.addEventListener('pointerdown', () => {
      window.focus();
      canvas.focus();
    });

    canvas.addEventListener('click', (e) => {
      window.focus();
      canvas.focus();
      const rect = canvas.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width) * SCREEN_W;
      const my = ((e.clientY - rect.top) / rect.height) * SCREEN_H;

      if (game.state === 'TITLE' || game.state === 'GAMEOVER' || game.state === 'VICTORY') {
        resetAndStartGame();
        return;
      }

      if (game.state === 'PAUSED') {
        for (const r of MENU_ITEM_RECTS) {
          if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
            switchItemSlot(r.slot);
            return;
          }
        }
      }
    });

    let lastTime = 0;
    function gameLoop(ts) {
      if (!lastTime) lastTime = ts;
      const dt = Math.min(0.05, (ts - lastTime) / 1000);
      lastTime = ts;
      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    window.onload = function () {
      window.focus();
      canvas.focus();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
